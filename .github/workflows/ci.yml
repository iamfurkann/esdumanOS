name: esdumanOS CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      ESDUMAN_KEY: "github_actions_dummy_key"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies (GCC, Clang, QEMU, Python)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib clang qemu-system-x86 python3 nasm mtools xorriso libssl-dev

      - name: 1. Run Host Unit Tests
        run: make test

      - name: 2. Run Fuzzing & Security Tests
        run: make fuzz

      - name: 3. Build Operating System
        run: make

      - name: 4. Run Kernel QEMU Integration & Regression Tests
        run: make test_kernel
