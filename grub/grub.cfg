# Boots on its own after three seconds.
#
# There was no timeout here at all until v1.6.0, which meant the menu waited for
# a keypress for ever. That was invisible while there was one entry and somebody
# was always watching, and it stops anything from booting this image unattended -
# an automated run gets a menu and a screendump of it.
set default=0
set timeout=3

# The one line that makes this image bootable on a machine with no BIOS.
#
# The kernel's Multiboot header asks for a linear framebuffer, and satisfying
# that request means GRUB has to set a video mode. On a BIOS machine it already
# can: grub-mkrescue builds the i386-pc core image with VBE support inside it, so
# the request has been working since the mode was first asked for. On UEFI the
# video driver is a separate module, and without it GRUB has no modes to offer at
# all - so it refuses the kernel with
#
#     error: no suitable video mode found.
#
# which reads like a complaint about the resolution that was asked for, or about
# the Multiboot header, and is neither. It is GRUB saying it has no video driver
# loaded. Every ISO this project published before v1.7.0 booted on BIOS only, and
# this line is the whole of the difference.
#
# Harmless where it is not needed: on BIOS the drivers are already in the core
# image and the insmod does nothing.
insmod all_video

# And the loader for the second specification, for the same reason.
#
# v1.7.0 learned that on UEFI the video driver is a separate module that has to
# be asked for by name. The Multiboot 2 loader is another one, and a menu entry
# using `multiboot2` without it fails with "unknown command" - which reads like
# a typo rather than like a missing module. Harmless where it is not needed.
insmod multiboot2

# Booted with Multiboot 2, which is what this release changed and the only
# reason it changed anything.
#
# Multiboot 1 cannot carry the ACPI RSDP, and on a UEFI machine there is no
# other source for it: the firmware puts it in the EFI configuration table,
# which only the bootloader ever sees. No RSDP means no FADT, and no FADT means
# the machine cannot be powered off. The kernel still carries both headers and
# translates the newer information structure into the older shape, so nothing
# above the boot path knows which one brought it up.
menuentry "esdumanOS" {
    multiboot2 /boot/myos.bin lock_kernel
    boot
}

# The same kernel, told to take a text mode.
#
# The kernel's Multiboot header asks for a linear framebuffer, and gfxpayload
# overrides that: GRUB hands over a text mode instead, the kernel finds no
# framebuffer in the information structure and stays on its VGA backend. Which
# is the path a machine takes whose bootloader cannot set a graphics mode, so
# this entry is also the only thing outside the test suite that ever walks it.
#
# It exists because a terminal cannot display a framebuffer. `make run_text`
# boots this one; most development is not about the screen, and curses over ssh
# is a great deal less trouble than a VNC client.
menuentry "esdumanOS (text mode console)" {
    set gfxpayload=text
    multiboot2 /boot/myos.bin lock_kernel
    boot
}

# The way every release before v1.12.0 booted, kept as a way back.
#
# The kernel still carries a Multiboot 1 header - it has to, because three of the
# four test targets boot with QEMU's -kernel and that reads nothing else - so
# this entry is not a compatibility shim written for the menu. It is the path
# the whole suite runs on, offered here as well.
#
# It is worth having because the first machine this project has ever run on is a
# machine nobody has tried yet. If `multiboot2` fails there, this entry still
# brings the system up; what it gives up is ACPI, which means `halt` falls back
# to stopping the CPU instead of cutting power. Everything else is identical.
menuentry "esdumanOS (Multiboot 1, no ACPI)" {
    multiboot /boot/myos.bin lock_kernel
    boot
}
